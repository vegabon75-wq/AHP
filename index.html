<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHP 의사결정 분석기</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a56db;--blue-dark:#1e40af;--blue-600:#2563eb;
  --blue-light:#eff6ff;--blue-border:#bfdbfe;
  --purple:#7c3aed;--purple-light:#f5f3ff;--purple-border:#ddd6fe;
  --teal:#0d9488;--teal-light:#f0fdfa;
  --green:#16a34a;--green-light:#f0fdf4;
  --amber:#d97706;--amber-light:#fffbeb;
  --red:#dc2626;--red-light:#fef2f2;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-150:#eaeff5;
  --gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;
  --gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
  --gray-800:#1e293b;--gray-900:#0f172a;
  --r:10px;--r-sm:7px;
  --sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --sh-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --sh-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
}
html,body{min-height:100vh;background:var(--gray-50);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;color:var(--gray-800);font-size:15px;line-height:1.6}

/* ── HEADER ─────────────────────────────────────────────── */
.app-hd{background:linear-gradient(135deg,#0f172a 0%,#1e3a6e 60%,#1a56db 100%);color:#fff;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.app-hd-left h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem}
.app-hd-left p{font-size:.8rem;opacity:.6;margin-top:.15rem}
.app-hd-right{font-size:.78rem;opacity:.55;text-align:right;line-height:1.8}

/* ── PROGRESS ────────────────────────────────────────────── */
.progress{display:flex;align-items:center;justify-content:center;gap:0;padding:1.1rem 2rem;background:#fff;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.s-item{display:flex;align-items:center;gap:.4rem}
.s-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;transition:all .3s;flex-shrink:0;border:2px solid var(--gray-300);background:#fff;color:var(--gray-400)}
.s-dot.active{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(26,86,219,.18)}
.s-dot.done{border-color:var(--green);background:var(--green);color:#fff}
.s-label{font-size:.78rem;color:var(--gray-500);white-space:nowrap;font-weight:500}
.s-label.active{color:var(--blue);font-weight:700}
.s-conn{width:52px;height:2px;background:var(--gray-200);margin:0 .35rem;flex-shrink:0;transition:background .3s}
.s-conn.done{background:var(--green)}
@media(max-width:540px){.s-label{display:none}.s-conn{width:24px}}

/* ── LAYOUT ──────────────────────────────────────────────── */
.main{max-width:980px;margin:0 auto;padding:2rem 1.5rem}

/* ── CARD ─────────────────────────────────────────────────── */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-md);padding:1.75rem;margin-bottom:1.25rem;border:1px solid var(--gray-200)}
.card-hd{font-size:1.1rem;font-weight:700;color:var(--gray-900);margin-bottom:.3rem;display:flex;align-items:center;gap:.45rem}
.card-sub{font-size:.83rem;color:var(--gray-500);margin-bottom:1.25rem}

/* ── FORM ─────────────────────────────────────────────────── */
label{display:block;font-size:.83rem;font-weight:600;color:var(--gray-600);margin-bottom:.35rem}
input[type=text]{width:100%;padding:.6rem .9rem;border:1.5px solid var(--gray-300);border-radius:var(--r-sm);font-size:.9rem;transition:border .2s,box-shadow .2s;outline:none;color:var(--gray-900);background:#fff}
input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.form-row{margin-bottom:1rem}

/* ── ITEM LISTS ───────────────────────────────────────────── */
.item-list{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;min-height:2rem}
.item-row{display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-sm);transition:all .15s}
.item-row:hover{border-color:var(--gray-300)}
.item-num{width:22px;height:22px;border-radius:50%;background:var(--blue-light);color:var(--blue);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item-name{flex:1;font-size:.88rem;color:var(--gray-800)}
.btn-icon{width:26px;height:26px;border:none;background:none;cursor:pointer;color:var(--gray-400);border-radius:5px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;padding:0}
.btn-icon:hover.del{background:var(--red-light);color:var(--red)}
.btn-icon:hover.expand{background:var(--blue-light);color:var(--blue)}
.add-row{display:flex;gap:.4rem}
.add-row input{flex:1;font-size:.85rem}
.btn-add{padding:.6rem 1rem;background:var(--blue-light);color:var(--blue);border:1.5px solid var(--blue-border);border-radius:var(--r-sm);cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap;transition:all .2s}
.btn-add:hover{background:var(--blue);color:#fff}

/* ── SUB-CRITERIA ────────────────────────────────────────── */
.sub-panel{margin:0 0 .4rem .5rem;padding:.6rem .75rem .75rem;background:var(--blue-light);border:1px solid var(--blue-border);border-radius:var(--r-sm);border-left:3px solid var(--blue)}
.sub-title{font-size:.76rem;font-weight:700;color:var(--blue-dark);margin-bottom:.45rem;display:flex;align-items:center;gap:.3rem}
.sub-items{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.4rem}
.sub-row{display:flex;align-items:center;gap:.4rem;padding:.4rem .6rem;background:#fff;border:1px solid var(--blue-border);border-radius:5px}
.sub-num{width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sub-name{flex:1;font-size:.83rem}
.sub-add{display:flex;gap:.35rem}
.sub-add input{flex:1;font-size:.8rem;padding:.45rem .7rem}
.btn-sub-add{padding:.45rem .8rem;background:#fff;color:var(--blue);border:1px solid var(--blue-border);border-radius:5px;cursor:pointer;font-size:.78rem;font-weight:600;white-space:nowrap;transition:all .15s}
.btn-sub-add:hover{background:var(--blue);color:#fff}

/* ── BUTTONS ──────────────────────────────────────────────── */
.btn{padding:.65rem 1.4rem;border-radius:var(--r-sm);font-size:.88rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem;line-height:1}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 4px rgba(26,86,219,.3)}
.btn-primary:hover:not(:disabled){background:var(--blue-dark);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:var(--gray-100);color:var(--gray-700);border:1.5px solid var(--gray-200)}
.btn-ghost:hover{background:var(--gray-200)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#15803d}
.btn-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.75rem;padding-top:1.25rem;border-top:1px solid var(--gray-100)}

/* ── TABS ─────────────────────────────────────────────────── */
.tabs{display:flex;gap:.2rem;flex-wrap:wrap;margin-bottom:1.25rem}
.tab{padding:.42rem .9rem;border:1.5px solid var(--gray-200);border-radius:999px;background:#fff;font-size:.8rem;font-weight:600;color:var(--gray-600);cursor:pointer;transition:all .18s;line-height:1}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.sub-tab.active{background:var(--purple);border-color:var(--purple)}
.tab.done-tab{border-color:var(--green);color:var(--green)}
.tab.active.done-tab{background:var(--green);color:#fff;border-color:var(--green)}

/* ── COMPARISON ROW ──────────────────────────────────────── */
.cmp-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:.75rem;transition:border .2s}
.cmp-card:hover{border-color:var(--blue-border)}
.cmp-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;margin-bottom:.75rem}
.cmp-lbl{font-weight:600;font-size:.85rem;padding:.35rem .6rem;border-radius:var(--r-sm);border:1px solid;text-align:center;line-height:1.3}
.cmp-lbl.left{color:var(--blue-dark);border-color:var(--blue-border);background:var(--blue-light)}
.cmp-lbl.right{color:var(--purple);border-color:var(--purple-border);background:var(--purple-light)}
.cmp-vs{color:var(--gray-400);font-size:.75rem;font-weight:700;text-align:center}
.scale-wrap{display:flex;align-items:center;justify-content:center;gap:2px;overflow-x:auto;padding:.15rem 0}
.sb{min-width:30px;height:30px;border:1.5px solid var(--gray-200);background:#fff;border-radius:5px;cursor:pointer;font-size:.75rem;font-weight:600;color:var(--gray-500);transition:all .12s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb:hover{border-color:var(--blue);color:var(--blue)}
.sb.al{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.1)}
.sb.ar{background:var(--purple);border-color:var(--purple);color:#fff;transform:scale(1.1)}
.sb.ae{background:var(--teal);border-color:var(--teal);color:#fff;transform:scale(1.1)}
.sep{width:1px;height:22px;background:var(--gray-300);flex-shrink:0;margin:0 1px}
.verbal{text-align:center;font-size:.78rem;color:var(--gray-500);margin-top:.45rem;min-height:1.1em}

/* ── CR BADGE ─────────────────────────────────────────────── */
.cr{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .7rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.cr-ok{background:#dcfce7;color:#166534}
.cr-warn{background:#fef9c3;color:#854d0e}
.cr-bad{background:#fee2e2;color:#991b1b}
.cr-na{background:var(--gray-100);color:var(--gray-600)}

/* ── RESULTS ──────────────────────────────────────────────── */
.res-tabs{display:flex;gap:.2rem;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:2px solid var(--gray-200);padding-bottom:.75rem}
.res-tab{padding:.5rem 1.1rem;border:none;background:none;font-size:.88rem;font-weight:600;color:var(--gray-500);cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;transition:all .18s;position:relative}
.res-tab.active{color:var(--blue);background:var(--blue-light)}
.res-tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--blue)}

.rank-list{display:flex;flex-direction:column;gap:.7rem}
.rank-item{display:grid;grid-template-columns:40px 1fr 60px;align-items:center;gap:1rem;padding:.85rem 1.1rem;background:var(--gray-50);border-radius:var(--r-sm);border:1px solid var(--gray-200)}
.rank-item:nth-child(1){background:linear-gradient(135deg,#fffbeb,#fef9c3);border-color:#fde68a}
.rank-item:nth-child(2){background:linear-gradient(135deg,#f8fafc,#f1f5f9);border-color:var(--gray-300)}
.rank-item:nth-child(3){background:linear-gradient(135deg,#fff7ed,#fed7aa);border-color:#fdba74}
.rank-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;background:var(--blue);color:#fff}
.rank-item:nth-child(1) .rank-num{background:var(--amber)}
.rank-item:nth-child(2) .rank-num{background:var(--gray-500)}
.rank-item:nth-child(3) .rank-num{background:#b45309}
.rank-name{font-weight:600;font-size:.9rem}
.rank-bar-bg{height:7px;background:var(--gray-200);border-radius:99px;margin-top:.3rem;overflow:hidden}
.rank-bar{height:100%;border-radius:99px;transition:width 1.1s cubic-bezier(.34,1.56,.64,1)}
.rank-pct{font-size:1.05rem;font-weight:800;color:var(--blue);text-align:right}
.rank-item:nth-child(1) .rank-pct{color:var(--amber)}

.wt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.wt-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-sm);padding:.85rem;text-align:center}
.wt-name{font-size:.8rem;color:var(--gray-600);font-weight:600;margin-bottom:.3rem}
.wt-val{font-size:1.4rem;font-weight:800;color:var(--blue)}
.wt-sub{font-size:.72rem;color:var(--gray-400)}

/* ── HIERARCHY TREE ──────────────────────────────────────── */
.tree{font-size:.85rem;line-height:1.8}
.tree-crit{font-weight:700;color:var(--gray-800);padding:.2rem 0;display:flex;align-items:center;gap:.5rem}
.tree-crit-w{background:var(--blue);color:#fff;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:700}
.tree-sub{padding-left:1.5rem;border-left:2px solid var(--blue-border);margin:0 0 .5rem .5rem}
.tree-leaf{display:flex;align-items:center;gap:.4rem;padding:.15rem 0;color:var(--gray-600)}
.tree-leaf-w{background:var(--gray-100);color:var(--gray-600);border-radius:999px;padding:.05rem .45rem;font-size:.7rem}
.tree-leaf-gw{background:var(--purple-light);color:var(--purple);border-radius:999px;padding:.05rem .45rem;font-size:.7rem;font-weight:700}

/* ── SENSITIVITY ─────────────────────────────────────────── */
.sens-intro{background:var(--blue-light);border:1px solid var(--blue-border);border-radius:var(--r-sm);padding:.85rem 1rem;font-size:.83rem;color:var(--blue-dark);margin-bottom:1.25rem}
.sens-section{margin-bottom:2rem}
.sens-crit-label{font-size:.95rem;font-weight:700;color:var(--gray-800);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.sens-chart-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r);padding:1rem;overflow:hidden}
.sens-legend{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.6rem}
.legend-chip{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:var(--gray-700)}
.legend-dot{width:12px;height:4px;border-radius:2px;flex-shrink:0}
.sens-slider-wrap{margin-top:.75rem;display:flex;align-items:center;gap:.75rem}
.sens-slider-wrap label{font-size:.8rem;color:var(--gray-600);white-space:nowrap;font-weight:600;min-width:80px}
.sens-slider-wrap input[type=range]{flex:1;accent-color:var(--blue)}
.sens-slider-val{font-size:.83rem;font-weight:700;color:var(--blue);min-width:44px;text-align:right}
.crossings{margin-top:.75rem;background:var(--amber-light);border:1px solid #fde68a;border-radius:var(--r-sm);padding:.7rem .9rem;font-size:.8rem}
.crossings-title{font-weight:700;color:var(--amber);margin-bottom:.3rem}
.crossing-row{color:var(--gray-700);padding:.15rem 0}

/* ── BREAKDOWN TABLE ─────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl th{background:var(--gray-100);padding:.5rem .7rem;text-align:center;font-weight:700;color:var(--gray-700);border-bottom:2px solid var(--gray-200);white-space:nowrap}
.tbl th.left{text-align:left}
.tbl td{padding:.45rem .7rem;border-bottom:1px solid var(--gray-100);text-align:center}
.tbl td.left{text-align:left;font-weight:600}
.tbl tr:last-child td{border:none}
.tbl .total{font-weight:800;color:var(--blue)}

/* ── CONSISTENCY TABLE ───────────────────────────────────── */
.cr-table{width:100%;border-collapse:collapse;font-size:.82rem}
.cr-table th{text-align:left;padding:.5rem .75rem;background:var(--gray-100);color:var(--gray-600);font-weight:700;border-bottom:2px solid var(--gray-200)}
.cr-table td{padding:.5rem .75rem;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.cr-table tr:last-child td{border:none}
.cr-table .indent{padding-left:1.5rem;color:var(--gray-500)}

/* ── INTRO ────────────────────────────────────────────────── */
.hero{text-align:center;padding:2.5rem 1rem 2rem;background:linear-gradient(135deg,#0f172a,#1e3a6e,#1a56db);color:#fff;margin:-2rem -1.5rem 2rem;border-radius:0 0 var(--r) var(--r)}
.hero h2{font-size:1.7rem;font-weight:800;margin-bottom:.5rem}
.hero p{opacity:.75;max-width:480px;margin:0 auto;line-height:1.7;font-size:.9rem}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.85rem;margin-bottom:1.75rem}
.feat{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-sm);padding:1.1rem;text-align:center}
.feat-icon{font-size:1.6rem;margin-bottom:.4rem}
.feat-title{font-weight:700;font-size:.85rem;color:var(--gray-800);margin-bottom:.2rem}
.feat-desc{font-size:.77rem;color:var(--gray-500);line-height:1.5}
.pro-badge{display:inline-block;background:var(--purple);color:#fff;font-size:.65rem;font-weight:700;padding:.1rem .35rem;border-radius:3px;vertical-align:middle;margin-left:.25rem}

/* ── MISC ─────────────────────────────────────────────────── */
.goal-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--blue-light);border:1px solid var(--blue-border);color:var(--blue-dark);border-radius:999px;padding:.3rem .9rem;font-size:.82rem;font-weight:600;margin-bottom:1.25rem}
.section-hd{font-size:.88rem;font-weight:700;color:var(--gray-700);border-bottom:2px solid var(--gray-100);padding-bottom:.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:.4rem;justify-content:space-between}
.scale-note{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-sm);padding:.55rem .85rem;font-size:.76rem;color:var(--gray-500);margin-top:.75rem;line-height:1.8}
.alert{display:flex;align-items:flex-start;gap:.5rem;padding:.75rem .9rem;border-radius:var(--r-sm);font-size:.82rem;margin-bottom:1rem}
.alert-info{background:var(--blue-light);border:1px solid var(--blue-border);color:var(--blue-dark)}
.empty-hint{color:var(--gray-400);font-size:.82rem;padding:.4rem;text-align:center}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .3s ease both}

::-webkit-scrollbar{width:7px;height:5px}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const RI = [0,0,0,.58,.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.54,1.56,1.57];
const VERBAL = {1:'동등',2:'약간',3:'보통',4:'보통+',5:'강한',6:'강한+',7:'매우강한',8:'매우강한+',9:'극히중요'};
const ALT_COLORS = ['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#c2410c','#be185d','#065f46','#1e40af'];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let _id = 0;
const uid = () => String(++_id);

const S = {
  step: 0,
  goal: '',
  criteria: [],   // [{id, name, sub:[{id,name}]}]
  alts: [],        // [{id, name}]
  criCmp: {},      // {"id1,id2": {p:'L'|'R'|'E', v:1-9}}
  subCriCmps: {},  // {criterionId: {"id1,id2": {p,v}}}
  altCmps: {},     // {leafId: {"id1,id2": {p,v}}}
  // UI state
  step2Tab: 0,     // 0=criteria, 1+=sub-criteria tabs
  step3Tab: 0,     // leaf criterion index
  resTab: 0,       // 0=결과, 1=민감도, 2=계층구조, 3=일관성
  sensTab: 0,      // which top-level criterion for sensitivity chart
  sensSim: {},     // {criterionIndex: simulatedWeight (0-1)}
};

// ═══════════════════════════════════════════════════════════
// AHP CORE — Power Iteration Eigenvector
// ═══════════════════════════════════════════════════════════
function buildMatrix(n, cmps, ids) {
  const M = Array.from({length:n}, (_,i) => Array.from({length:n}, (_,j) => i===j?1:0));
  for (let i=0;i<n;i++) {
    for (let j=i+1;j<n;j++) {
      const c = cmps[`${ids[i]},${ids[j]}`] || {p:'E',v:1};
      const val = c.p==='E' ? 1 : c.p==='L' ? c.v : 1/c.v;
      M[i][j] = val;
      M[j][i] = 1/val;
    }
  }
  return M;
}

function calcAHP(M) {
  const n = M.length;
  if (n === 1) return {w:[1], lmax:1, CI:0, CR:0};
  if (n === 0) return {w:[], lmax:0, CI:0, CR:0};

  // Power iteration for accurate principal eigenvector
  let w = new Array(n).fill(1/n);
  for (let iter=0; iter<300; iter++) {
    const Mw = M.map(row => row.reduce((s,v,j) => s+v*w[j], 0));
    const sum = Mw.reduce((s,v) => s+v, 0);
    const wNew = Mw.map(v => v/sum);
    const diff = wNew.reduce((s,v,i) => s+Math.abs(v-w[i]), 0);
    w = wNew;
    if (diff < 1e-12) break;
  }

  // λmax
  const lmax = M.reduce((s,row,i) =>
    s + row.reduce((rs,v,j) => rs+v*w[j], 0) / w[i], 0) / n;

  const CI = (lmax-n)/(n-1);
  const ri = RI[Math.min(n,14)] || 1.57;
  const CR = n<=2 ? 0 : CI/ri;
  return {w, lmax, CI, CR};
}

function getLeaves() {
  // Returns flat array of leaf criteria
  // [{id, name, parentId (or null), parentIdx, localIdx, label}]
  const leaves = [];
  S.criteria.forEach((c,ci) => {
    if (c.sub && c.sub.length > 0) {
      c.sub.forEach((sc,si) => leaves.push({
        id: sc.id, name: sc.name,
        parentId: c.id, parentName: c.name,
        parentIdx: ci, localIdx: si,
        label: `${c.name} › ${sc.name}`
      }));
    } else {
      leaves.push({
        id: c.id, name: c.name,
        parentId: null, parentName: null,
        parentIdx: ci, localIdx: -1,
        label: c.name
      });
    }
  });
  return leaves;
}

function finalScores() {
  const cn = S.criteria.length;
  const an = S.alts.length;
  if (cn<2 || an<2) return null;

  const cIds = S.criteria.map(c=>c.id);
  const aIds = S.alts.map(a=>a.id);

  // 1. Top-level criteria weights
  const criM = buildMatrix(cn, S.criCmp, cIds);
  const {w:criW, CR:criCR} = calcAHP(criM);

  // 2. Sub-criteria weights
  const subWs = {}; // {criterionId: weight array}
  const subCRs = {};
  S.criteria.forEach((c,ci) => {
    if (c.sub && c.sub.length > 0) {
      const sIds = c.sub.map(s=>s.id);
      const M = buildMatrix(c.sub.length, S.subCriCmps[c.id]||{}, sIds);
      const {w,CR} = calcAHP(M);
      subWs[c.id] = w;
      subCRs[c.id] = CR;
    }
  });

  // 3. Leaf global weights
  const leaves = getLeaves();
  const leafWs = leaves.map(leaf => {
    if (leaf.parentId) {
      const sw = subWs[leaf.parentId] || [];
      return criW[leaf.parentIdx] * (sw[leaf.localIdx] || 0);
    }
    return criW[leaf.parentIdx];
  });

  // 4. Alternative weights per leaf
  const altWs = [];
  const altCRs = [];
  leaves.forEach(leaf => {
    const M = buildMatrix(an, S.altCmps[leaf.id]||{}, aIds);
    const {w,CR} = calcAHP(M);
    altWs.push(w);
    altCRs.push(CR);
  });

  // 5. Final scores
  const scores = aIds.map((_,ai) =>
    leafWs.reduce((s,lw,li) => s+lw*altWs[li][ai], 0)
  );

  return {criW, subWs, subCRs, leafWs, altWs, scores, criCR, altCRs, leaves};
}

// SENSITIVITY ANALYSIS
// ═══════════════════════════════════════════════════════════
function sensitivityData(k, criW, leaves, leafWs, altWs) {
  const n = S.criteria.length;
  const m = S.alts.length;
  const pts = 101;
  const data = Array.from({length:m}, () => []);

  // Which leaves belong to top-level criterion k?
  const isK = leaves.map(leaf => leaf.parentIdx === k);
  const kSum = leafWs.reduce((s,lw,li) => isK[li] ? s+lw : s, 0);
  const otherSum = 1 - kSum;

  for (let t=0; t<pts; t++) {
    const newKW = t/(pts-1); // 0 to 1
    const newLeafWs = leafWs.map((lw,li) => {
      if (isK[li]) {
        return kSum > 1e-9 ? lw/kSum * newKW : newKW/isK.filter(Boolean).length;
      } else {
        return otherSum > 1e-9 ? lw/otherSum * (1-newKW) : (1-newKW)/isK.filter(b=>!b).length;
      }
    });
    for (let ai=0; ai<m; ai++) {
      data[ai].push(newLeafWs.reduce((s,lw,li) => s+lw*altWs[li][ai], 0));
    }
  }

  // Find crossover points
  const crossings = [];
  for (let ai=0; ai<m; ai++) {
    for (let aj=ai+1; aj<m; aj++) {
      for (let t=0; t<pts-1; t++) {
        const d1 = data[ai][t] - data[aj][t];
        const d2 = data[ai][t+1] - data[aj][t+1];
        if (d1*d2 < 0) {
          const x = (t + d1/(d1-d2)) / (pts-1);
          crossings.push({x, ai, aj, aWins: d2>0});
        }
      }
    }
  }

  return {data, crossings};
}

function renderSensChart(k, criW, leaves, leafWs, altWs, simW) {
  const {data, crossings} = sensitivityData(k, criW, leaves, leafWs, altWs);
  const W=580, H=260;
  const pad={l:52,r:20,t:24,b:48};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const pts=data[0].length;
  const m=S.alts.length;

  let yMin=Infinity, yMax=-Infinity;
  data.forEach(line=>line.forEach(v=>{if(v<yMin)yMin=v;if(v>yMax)yMax=v;}));
  const yPad=(yMax-yMin)*0.08||0.05;
  yMin=Math.max(0,yMin-yPad); yMax=Math.min(1,yMax+yPad);

  const xs = x => pad.l + x*pw;
  const ys = y => pad.t + ph - Math.max(0,Math.min(1,(y-yMin)/(yMax-yMin)))*ph;

  // Grid
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  svg += `<rect x="${pad.l}" y="${pad.t}" width="${pw}" height="${ph}" fill="#f8fafc" rx="3"/>`;
  [0,.2,.4,.6,.8,1].forEach(x=>{
    svg+=`<line x1="${xs(x)}" y1="${pad.t}" x2="${xs(x)}" y2="${pad.t+ph}" stroke="#e2e8f0" stroke-width="1"/>`;
    svg+=`<text x="${xs(x)}" y="${H-8}" text-anchor="middle" fill="#94a3b8" font-size="10.5">${Math.round(x*100)}%</text>`;
  });
  const yTks=4;
  for(let i=0;i<=yTks;i++){
    const y=yMin+(yMax-yMin)*i/yTks;
    svg+=`<line x1="${pad.l}" y1="${ys(y)}" x2="${pad.l+pw}" y2="${ys(y)}" stroke="#e2e8f0" stroke-width="1"/>`;
    svg+=`<text x="${pad.l-5}" y="${ys(y)+4}" text-anchor="end" fill="#94a3b8" font-size="10.5">${(y*100).toFixed(0)}%</text>`;
  }

  // Axes labels
  svg+=`<text x="${pad.l+pw/2}" y="${H-2}" text-anchor="middle" fill="#64748b" font-size="11.5" font-weight="600">${escH(S.criteria[k].name)} 가중치 (%)</text>`;
  svg+=`<text x="11" y="${pad.t+ph/2+4}" text-anchor="middle" fill="#64748b" font-size="11.5" font-weight="600" transform="rotate(-90,11,${pad.t+ph/2})">최종 점수</text>`;

  // Lines
  data.forEach((line,ai)=>{
    const d=line.map((v,t)=>`${t===0?'M':'L'}${xs(t/(pts-1))},${ys(v)}`).join(' ');
    svg+=`<path d="${d}" fill="none" stroke="${ALT_COLORS[ai%ALT_COLORS.length]}" stroke-width="2.2" stroke-linejoin="round"/>`;
  });

  // Crossover markers
  crossings.forEach(cr=>{
    const cx=xs(cr.x);
    svg+=`<circle cx="${cx}" cy="${(pad.t+pad.t+ph)/2}" r="3" fill="#f59e0b" opacity=".9"/>`;
  });

  // Current / simulated weight line
  const curW = simW !== undefined ? simW : criW[k];
  const cx2=xs(curW);
  svg+=`<line x1="${cx2}" y1="${pad.t}" x2="${cx2}" y2="${pad.t+ph}" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5,3"/>`;
  svg+=`<rect x="${cx2-22}" y="${pad.t-18}" width="44" height="16" rx="3" fill="#0f172a"/>`;
  svg+=`<text x="${cx2}" y="${pad.t-7}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">${(curW*100).toFixed(1)}%</text>`;

  // Dots at current position
  data.forEach((line,ai)=>{
    const tIdx=Math.round(curW*(pts-1));
    const cy=ys(line[Math.min(tIdx,pts-1)]);
    svg+=`<circle cx="${cx2}" cy="${cy}" r="4.5" fill="${ALT_COLORS[ai%ALT_COLORS.length]}" stroke="#fff" stroke-width="1.5"/>`;
  });

  svg+='</svg>';

  // Legend
  const legendHtml = S.alts.map((a,ai)=>`
    <div class="legend-chip">
      <div class="legend-dot" style="background:${ALT_COLORS[ai%ALT_COLORS.length]}"></div>
      <span>${escH(a.name)}</span>
    </div>`).join('');

  // Crossover table
  let crossHtml = '';
  if (crossings.length > 0) {
    const rows = crossings.map(cr=>{
      const w = (cr.x*100).toFixed(1);
      const winner = S.alts[cr.aWins ? cr.ai : cr.aj]?.name;
      const loser  = S.alts[cr.aWins ? cr.aj : cr.ai]?.name;
      return `<div class="crossing-row">• 가중치 <b>${w}%</b> 이상에서 <b>${escH(winner)}</b>가 <b>${escH(loser)}</b>보다 우위</div>`;
    }).join('');
    crossHtml = `<div class="crossings"><div class="crossings-title">⚡ 순위 역전 지점</div>${rows}</div>`;
  }

  // Slider
  const simVal = simW !== undefined ? simW : criW[k];
  const sliderHtml = `
    <div class="sens-slider-wrap">
      <label>가중치 시뮬레이션</label>
      <input type="range" min="0" max="100" value="${(simVal*100).toFixed(0)}"
        oninput="simSens(${k},this.value/100)" style="cursor:pointer">
      <span class="sens-slider-val" id="sensVal${k}">${(simVal*100).toFixed(1)}%</span>
    </div>`;

  return `
    <div class="sens-section">
      <div class="sens-crit-label">
        <span>📈</span> <span>${escH(S.criteria[k].name)}</span>
        <span style="font-size:.8rem;color:var(--gray-400);font-weight:400">현재 가중치: ${(criW[k]*100).toFixed(1)}%</span>
      </div>
      <div class="sens-chart-wrap">
        ${svg}
        <div class="sens-legend">${legendHtml}</div>
        ${sliderHtml}
        ${crossHtml}
      </div>
    </div>`;
}

    content=`
      <div class="section-hd">
        <span>⚖️ [${escH(c.name)}] 하위기준 비교</span>
        ${crBadge(CR,sn)}
      </div>
      ${pairs.map(([i,j])=>cmpRow(c.sub[i],c.sub[j],cmpMap,`sub_${c.id}`)).join('')}`;
  }

  return `
    <div class="goal-pill">🎯 ${escH(S.goal)}</div>
    <div class="card">
      <div class="card-hd">⚖️ 쌍 비교 — 기준 중요도</div>
      <div class="card-sub">두 항목 중 더 중요한 쪽을 선택하고, 숫자로 강도를 지정하세요. 숫자가 클수록 더 중요합니다.</div>
      ${hasSub?`<div class="tabs">${tabs}</div>`:''}
      ${content}
      ${scaleNote()}
    </div>
    <div class="btn-nav">
      <button class="btn btn-ghost" onclick="goStep(1)">← 설정으로</button>
      <button class="btn btn-primary" onclick="goStep(3)">다음: 대안 비교 →</button>
    </div>`;
}

// ─── STEP 3: ALTERNATIVE COMPARISON ──────────────────────
function renderStep3() {
  const leaves = getLeaves();
  if(!leaves.length) return '<div>기준을 먼저 설정하세요.</div>';

  const tab = Math.min(S.step3Tab, leaves.length-1);
  const leaf = leaves[tab];
  const n=S.alts.length;
  const cmpMap=S.altCmps[leaf.id]||{};
  const {CR}=calcAHP(buildMatrix(n,cmpMap,S.alts.map(a=>a.id)));

  const tabs=leaves.map((l,i)=>{
    const filled=Object.keys(S.altCmps[l.id]||{}).length;
    const total=n*(n-1)/2;
    const done=filled>=total&&total>0;
    return `<button class="tab ${i===tab?'active':''} ${done?'done-tab':''}" onclick="setS3Tab(${i})">${escH(l.label)}</button>`;
  }).join('');

  const pairs=[];
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) pairs.push([i,j]);

  const totalLeaves=leaves.length;
  const doneCnt=leaves.filter(l=>{
    const f=Object.keys(S.altCmps[l.id]||{}).length;
    return f>=n*(n-1)/2&&n*(n-1)/2>0;
  }).length;

  return `
    <div class="goal-pill">🎯 ${escH(S.goal)}</div>
    <div class="card">
      <div class="card-hd">🔄 대안 쌍 비교 (기준별)</div>
      <div class="card-sub">각 기준에 대해 대안들을 비교하세요. 탭으로 기준을 전환합니다.
        <span style="font-weight:700;color:${doneCnt===totalLeaves?'var(--green)':'var(--amber)'}">
          (${doneCnt}/${totalLeaves} 완료)
        </span>
      </div>
      <div class="tabs">${tabs}</div>
      <div class="section-hd">
        <span>🔍 기준: <b>${escH(leaf.label)}</b></span>
        ${crBadge(CR,n)}
      </div>
      ${pairs.map(([i,j])=>cmpRow(S.alts[i],S.alts[j],cmpMap,`alt_${leaf.id}`)).join('')}
      ${scaleNote()}
    </div>
    <div class="btn-nav">
      <button class="btn btn-ghost" onclick="goStep(2)">← 기준 비교</button>
      <button class="btn btn-success" onclick="goStep(4)">📊 결과 보기 →</button>
    </div>`;
}

// ─── STEP 4: RESULTS ──────────────────────────────────────
function renderResults() {
  const res = finalScores();
  if(!res) return '<div>데이터가 부족합니다.</div>';
  const {criW,subWs,subCRs,leafWs,altWs,scores,criCR,altCRs,leaves}=res;

  const resTabs=`
    <div class="res-tabs">
      <button class="res-tab ${S.resTab===0?'active':''}" onclick="setResTab(0)">🏆 결과</button>
      <button class="res-tab ${S.resTab===1?'active':''}" onclick="setResTab(1)">📈 민감도 분석</button>
      <button class="res-tab ${S.resTab===2?'active':''}" onclick="setResTab(2)">🌳 계층 구조</button>
      <button class="res-tab ${S.resTab===3?'active':''}" onclick="setResTab(3)">✅ 일관성 검증</button>
    </div>`;

  let content='';
  if(S.resTab===0) content=renderResMain(res);
  else if(S.resTab===1) content=renderResSens(res);
  else if(S.resTab===2) content=renderResTree(res);
  else if(S.resTab===3) content=renderResCR(res);

  return `
    <div class="goal-pill">🎯 ${escH(S.goal)}</div>
    <div class="card">
      ${resTabs}
      ${content}
    </div>
    <div class="btn-nav">
      <button class="btn btn-ghost" onclick="goStep(3)">← 대안 비교</button>
      <div style="display:flex;gap:.6rem">
        <button class="btn btn-ghost" onclick="window.print()">🖨️ 인쇄</button>
        <button class="btn btn-primary" onclick="resetAll()">새 분석</button>
      </div>
    </div>`;
}

function renderResMain({criW,leafWs,altWs,scores,leaves}) {
  const ranked = S.alts.map((a,i)=>({...a,score:scores[i]})).sort((a,b)=>b.score-a.score);
  const maxS = ranked[0].score;
  const bColors=['linear-gradient(90deg,#d97706,#f59e0b)','linear-gradient(90deg,var(--gray-400),var(--gray-500))','linear-gradient(90deg,#b45309,#d97706)'];

  const rankHTML = ranked.map((a,r)=>`
    <div class="rank-item">
      <div class="rank-num">${r+1}</div>
      <div>
        <div class="rank-name">${escH(a.name)}</div>
        <div class="rank-bar-bg">
          <div class="rank-bar" data-pct="${(a.score/maxS*100).toFixed(1)}"
            style="width:0%;background:${r<3?bColors[r]:'var(--blue)'}"></div>
        </div>
      </div>
      <div class="rank-pct">${(a.score*100).toFixed(1)}%</div>
    </div>`).join('');

  // Criteria weights
  const wHTML = S.criteria.map((c,i)=>`
    <div class="wt-card">
      <div class="wt-name">${escH(c.name)}</div>
      <div class="wt-val">${(criW[i]*100).toFixed(1)}<span style="font-size:.85rem">%</span></div>
      <div class="wt-sub">가중치 ${criW[i].toFixed(4)}</div>
    </div>`).join('');

  // Breakdown table
  const thHTML = leaves.map(l=>`<th>${escH(l.label)}<br><small style="font-weight:400">${(leafWs[leaves.indexOf(l)]*100).toFixed(0)}%</small></th>`).join('');
  const tbHTML = ranked.map(a=>{
    const ai=S.alts.findIndex(x=>x.id===a.id);
    const cells=leaves.map((_,li)=>`<td>${(altWs[li][ai]*100).toFixed(1)}%</td>`).join('');
    return `<tr><td class="left">${escH(a.name)}</td>${cells}<td class="total">${(a.score*100).toFixed(1)}%</td></tr>`;
  }).join('');

  return `
    <div class="section-hd">🏆 최종 순위</div>
    <div class="rank-list" style="margin-bottom:1.5rem">${rankHTML}</div>

    <div class="section-hd">📐 기준별 가중치</div>
    <div class="wt-grid" style="margin-bottom:1.5rem">${wHTML}</div>

    <div class="section-hd">📊 상세 점수 분해</div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th class="left">대안</th>${thHTML}<th>종합</th></tr></thead>
        <tbody>${tbHTML}</tbody>
      </table>
    </div>`;
}

function renderResSens({criW,leafWs,altWs,leaves}) {
  const intro=`<div class="sens-intro">
    기준의 가중치를 변화시켰을 때 각 대안의 최종 점수가 어떻게 달라지는지 보여줍니다.
    <b>수직 점선</b>이 현재 가중치이며, 슬라이더로 시뮬레이션할 수 있습니다.
    <b>노란 점</b>은 순위 역전이 일어나는 지점입니다.
  </div>`;

  const tabsHTML=`
    <div class="tabs" style="margin-bottom:1.25rem">
      ${S.criteria.map((c,k)=>`
        <button class="tab ${S.sensTab===k?'active':''}" onclick="setSensTab(${k})">
          ${escH(c.name)}
        </button>`).join('')}
    </div>`;

  const k=S.sensTab;
  const simW=S.sensSim[k];
  const chart=renderSensChart(k,criW,leaves,leafWs,altWs,simW);

  return `${intro}${tabsHTML}${chart}`;
}

function renderResTree({criW,subWs,leafWs,leaves}) {
  const treeHTML=S.criteria.map((c,ci)=>{
    const hasSub=c.sub&&c.sub.length>0;
    let inner='';
    if(hasSub) {
      const sw=subWs[c.id]||[];
      inner=`<div class="tree-sub">
        ${c.sub.map((sc,si)=>{
          const gw=criW[ci]*(sw[si]||0);
          return `<div class="tree-leaf">
            ├─ ${escH(sc.name)}
            <span class="tree-leaf-w">내부 ${((sw[si]||0)*100).toFixed(1)}%</span>
            <span class="tree-leaf-gw">전역 ${(gw*100).toFixed(1)}%</span>
          </div>`;
        }).join('')}
      </div>`;
    }
    return `
      <div class="tree-crit">
        <span class="tree-crit-w">${(criW[ci]*100).toFixed(1)}%</span>
        ${escH(c.name)}
        ${hasSub?'<span style="font-size:.75rem;color:var(--gray-400)">(하위기준 있음)</span>':''}
      </div>
      ${inner}`;
  }).join('');

  // Global leaf weights bar
  const leafBars=leaves.map((leaf,li)=>`
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;font-size:.83rem">
      <div style="min-width:140px;color:var(--gray-700);font-weight:600">${escH(leaf.label)}</div>
      <div style="flex:1;height:10px;background:var(--gray-200);border-radius:99px;overflow:hidden">
        <div class="rank-bar" data-pct="${(leafWs[li]*100/Math.max(...leafWs)*100).toFixed(1)}"
          style="width:0%;height:100%;background:var(--blue);border-radius:99px;transition:width 1s cubic-bezier(.34,1.56,.64,1)"></div>
      </div>
      <div style="min-width:46px;text-align:right;font-weight:700;color:var(--blue)">${(leafWs[li]*100).toFixed(1)}%</div>
    </div>`).join('');

  return `
    <div class="section-hd">🌳 계층 가중치 트리</div>
    <div class="tree" style="margin-bottom:1.5rem">${treeHTML}</div>
    <div class="section-hd">📊 전역(Global) 리프 가중치</div>
    <div style="margin-bottom:.5rem;font-size:.78rem;color:var(--gray-500)">모든 리프 기준의 전역 가중치 합 = 100%</div>
    ${leafBars}`;
}

function renderResCR({criCR,subCRs,altCRs,leaves}) {
  const rows=[];
  rows.push(`<tr><td>기준 간 비교</td><td>${S.criteria.length}개</td><td>${crBadge(criCR,S.criteria.length)}</td><td>${(criCR*100).toFixed(1)}%</td></tr>`);

  S.criteria.forEach(c=>{
    if(c.sub&&c.sub.length>0) {
      const cr=subCRs[c.id]||0;
      rows.push(`<tr><td class="indent">${escH(c.name)} 하위기준</td><td>${c.sub.length}개</td><td>${crBadge(cr,c.sub.length)}</td><td>${(cr*100).toFixed(1)}%</td></tr>`);
    }
  });

  leaves.forEach((leaf,li)=>{
    const cr=altCRs[li]||0;
    rows.push(`<tr><td class="indent">${escH(leaf.label)} 대안 비교</td><td>${S.alts.length}개</td><td>${crBadge(cr,S.alts.length)}</td><td>${(cr*100).toFixed(1)}%</td></tr>`);
  });

  const allOK=[criCR,...Object.values(subCRs||{}),...(altCRs||[])].every(cr=>cr<0.10);

  return `
    <div class="section-hd">✅ 전체 일관성 검증</div>
    ${allOK
      ? `<div class="alert alert-info">모든 비교 행렬의 일관성 비율(CR)이 0.10 미만으로 분석 결과를 신뢰할 수 있습니다.</div>`
      : `<div class="alert" style="background:#fef9c3;border-color:#fde68a;color:#854d0e">일부 비교의 CR이 기준(0.10)을 초과합니다. 해당 단계로 돌아가 비교를 재검토하세요.</div>`}
    <table class="cr-table">
      <thead><tr><th>비교 항목</th><th>크기</th><th>판정</th><th>CR</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    <div style="margin-top:.75rem;font-size:.78rem;color:var(--gray-500)">
      CR &lt; 10%: 양호 · CR 10–20%: 재검토 권장 · CR &gt; 20%: 비교 재수행 필요<br>
      n ≤ 2인 경우 CR 산출 불가 (일관성 자동 보장)
    </div>`;
}

// ─── CMP ROW ──────────────────────────────────────────────
function cmpRow(itemA, itemB, cmpMap, prefix) {
  const key=`${itemA.id},${itemB.id}`;
  const c=cmpMap[key]||{p:'E',v:1};
  const lBtns=[9,8,7,6,5,4,3,2].map(v=>`
    <button class="sb ${c.p==='L'&&c.v===v?'al':''}"
      data-key="${key}" data-p="L" data-v="${v}" data-pfx="${prefix}">${v}</button>`).join('');
  const rBtns=[2,3,4,5,6,7,8,9].map(v=>`
    <button class="sb ${c.p==='R'&&c.v===v?'ar':''}"
      data-key="${key}" data-p="R" data-v="${v}" data-pfx="${prefix}">${v}</button>`).join('');
  const eBtn=`<button class="sb ${c.p==='E'?'ae':''}" style="font-weight:800;min-width:34px"
    data-key="${key}" data-p="E" data-v="1" data-pfx="${prefix}">1</button>`;

  let verbal='';
  if(c.p==='E') verbal=`⚖️ <b>동등</b>하게 중요`;
  else {
    const who=c.p==='L'?`<b style="color:var(--blue)">${escH(itemA.name)}</b>`:`<b style="color:var(--purple)">${escH(itemB.name)}</b>`;
    verbal=`${who}이(가) <b>${VERBAL[c.v]||c.v}(${c.v}배)</b> 더 중요`;
  }
  const mv=c.p==='E'?1:c.p==='L'?c.v:1/c.v;
  const ms=mv>=1?mv.toFixed(mv===Math.round(mv)?0:3):`1/${Math.round(1/mv)}`;

  return `
    <div class="cmp-card">
      <div class="cmp-hd">
        <div class="cmp-lbl left">${escH(itemA.name)}</div>
        <div class="cmp-vs">VS</div>
        <div class="cmp-lbl right">${escH(itemB.name)}</div>
      </div>
      <div class="scale-wrap">
        <span style="font-size:.68rem;color:var(--blue);font-weight:700;flex-shrink:0">←</span>
        ${lBtns}<div class="sep"></div>${eBtn}<div class="sep"></div>${rBtns}
        <span style="font-size:.68rem;color:var(--purple);font-weight:700;flex-shrink:0">→</span>
      </div>
      <div class="verbal">${verbal} <span style="color:var(--gray-300)">[${ms}]</span></div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════
function attachEvents() {
  const gi=$('goalInp'); if(gi) gi.addEventListener('input',e=>S.goal=e.target.value);
  const ci=$('criInp');  if(ci) ci.addEventListener('keydown',e=>e.key==='Enter'&&addCri());
  const ai=$('altInp');  if(ai) ai.addEventListener('keydown',e=>e.key==='Enter'&&addAlt());

  // Sub-criteria inputs
  S.criteria.forEach(c=>{
    const el=$(`subInp_${c.id}`);
    if(el) el.addEventListener('keydown',e=>e.key==='Enter'&&addSub(c.id));
  });

  // Scale buttons
  document.querySelectorAll('.sb[data-key]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const {key,p,pfx}=btn.dataset;
      const v=parseInt(btn.dataset.v);
      const val={p,v};
      if(pfx==='cri') S.criCmp[key]=val;
      else if(pfx.startsWith('sub_')) {
        const cid=pfx.slice(4);
        if(!S.subCriCmps[cid]) S.subCriCmps[cid]={};
        S.subCriCmps[cid][key]=val;
      } else if(pfx.startsWith('alt_')) {
        const lid=pfx.slice(4);
        if(!S.altCmps[lid]) S.altCmps[lid]={};
        S.altCmps[lid][key]=val;
      }
      render();
    });
  });
}

// ═══════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════
function goStep(n) {
  syncGoal();
  S.step=n;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function syncGoal() {
  const g=$('goalInp'); if(g) S.goal=g.value.trim();
}

function setS2Tab(i) { S.step2Tab=i; render(); }
function setS3Tab(i) { S.step3Tab=i; render(); }
function setResTab(i) { S.resTab=i; render(); if(i===0) setTimeout(animBars,80); }
function setSensTab(k) { S.sensTab=k; render(); }

function simSens(k,v) {
  S.sensSim[k]=v;
  render();
}

function addCri() {
  syncGoal();
  const el=$('criInp'); if(!el) return;
  const name=el.value.trim(); if(!name) return;
  if(S.criteria.length>=10) return;
  if(S.criteria.some(x=>x.name.toLowerCase()===name.toLowerCase())) { flash(el); return; }
  S.criteria.push({id:uid(), name, sub:[]});
  el.value='';
  render(); focus('criInp');
}

function delCri(id) {
  syncGoal();
  S.criteria=S.criteria.filter(x=>x.id!==id);
  // Clean comparisons
  const newCmp={};
  Object.entries(S.criCmp).forEach(([k,v])=>{ if(!k.includes(','+id)&&!k.startsWith(id+',')) newCmp[k]=v; });
  S.criCmp=newCmp;
  delete S.subCriCmps[id];
  delete S.altCmps[id];
  render();
}

function toggleSub(cid) {
  syncGoal();
  const c=S.criteria.find(x=>x.id===cid); if(!c) return;
  c._expanded = !c._expanded;
  render();
}

function addSub(cid) {
  const el=$(`subInp_${cid}`); if(!el) return;
  const name=el.value.trim(); if(!name) return;
  const c=S.criteria.find(x=>x.id===cid); if(!c) return;
  if(c.sub.length>=8) return;
  if(c.sub.some(s=>s.name.toLowerCase()===name.toLowerCase())) { flash(el); return; }
  c.sub.push({id:uid(),name});
  el.value='';
  render(); focus(`subInp_${cid}`);
}

function delSub(cid,sid) {
  const c=S.criteria.find(x=>x.id===cid); if(!c) return;
  c.sub=c.sub.filter(s=>s.id!==sid);
  // Clean sub comparisons
  if(S.subCriCmps[cid]) {
    const newM={};
    Object.entries(S.subCriCmps[cid]).forEach(([k,v])=>{ if(!k.includes(','+sid)&&!k.startsWith(sid+',')) newM[k]=v; });
    S.subCriCmps[cid]=newM;
  }
  delete S.altCmps[sid];
  render();
}

function addAlt() {
  syncGoal();
  const el=$('altInp'); if(!el) return;
  const name=el.value.trim(); if(!name) return;
  if(S.alts.length>=10) return;
  if(S.alts.some(x=>x.name.toLowerCase()===name.toLowerCase())) { flash(el); return; }
  S.alts.push({id:uid(), name});
  el.value='';
  render(); focus('altInp');
}

function delAlt(id) {
  syncGoal();
  S.alts=S.alts.filter(x=>x.id!==id);
  Object.keys(S.altCmps).forEach(lid=>{
    const newM={};
    Object.entries(S.altCmps[lid]).forEach(([k,v])=>{ if(!k.includes(','+id)&&!k.startsWith(id+',')) newM[k]=v; });
    S.altCmps[lid]=newM;
  });
  render();
}

function resetAll() {
  Object.assign(S,{step:0,goal:'',criteria:[],alts:[],criCmp:{},subCriCmps:{},altCmps:{},
    step2Tab:0,step3Tab:0,resTab:0,sensTab:0,sensSim:{}});
  render();
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const escH = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const focus = id => setTimeout(()=>{ const el=$(id); if(el) el.focus(); },30);
function flash(el){ el.style.borderColor='var(--red)'; setTimeout(()=>el.style.borderColor='',1500); }

function crBadge(cr,n) {
  if(n<=2) return `<span class="cr cr-na">n≤2</span>`;
  const p=(cr*100).toFixed(1);
  if(cr<.10) return `<span class="cr cr-ok">✓ CR ${p}%</span>`;
  if(cr<.20) return `<span class="cr cr-warn">⚠ CR ${p}%</span>`;
  return `<span class="cr cr-bad">✗ CR ${p}%</span>`;
}

function scaleNote() {
  return `<div class="scale-note">

// DEMO DATA
// ═══════════════════════════════════════════════════════════
function loadDemo() {
  resetAll();
  S.goal='최적 IT 프로젝트 선정';
  const cIds=[uid(),uid(),uid()];
  const sIds=[[uid(),uid()],[uid(),uid()],[uid(),uid()]];
  S.criteria=[
    {id:cIds[0],name:'기술적 타당성',sub:[{id:sIds[0][0],name:'개발 난이도'},{id:sIds[0][1],name:'기술 성숙도'}],_expanded:false},
    {id:cIds[1],name:'비용/효과',sub:[{id:sIds[1][0],name:'초기 비용'},{id:sIds[1][1],name:'ROI'}],_expanded:false},
    {id:cIds[2],name:'전략적 가치',sub:[],_expanded:false},
  ];
  const aIds=[uid(),uid(),uid()];
  S.alts=[
    {id:aIds[0],name:'클라우드 마이그레이션'},
    {id:aIds[1],name:'AI 고객서비스'},
    {id:aIds[2],name:'모바일 앱 개발'},
  ];

  // Criteria comparisons
  S.criCmp={
    [`${cIds[0]},${cIds[1]}`]:{p:'L',v:3},
    [`${cIds[0]},${cIds[2]}`]:{p:'R',v:2},
    [`${cIds[1]},${cIds[2]}`]:{p:'R',v:3},
  };

  // Sub-criteria comparisons
  S.subCriCmps={
    [cIds[0]]:{[`${sIds[0][0]},${sIds[0][1]}`]:{p:'L',v:2}},
    [cIds[1]]:{[`${sIds[1][0]},${sIds[1][1]}`]:{p:'R',v:5}},
  };

  // Alt comparisons per leaf
  function altCmp(ai,aj,ak,p0,v0,p1,v1,p2,v2){
    return {
      [`${aIds[ai]},${aIds[aj]}`]:{p:p0,v:v0},
      [`${aIds[ai]},${aIds[ak]}`]:{p:p1,v:v1},
      [`${aIds[aj]},${aIds[ak]}`]:{p:p2,v:v2},
    };
  }
  S.altCmps={
    [sIds[0][0]]:altCmp(0,1,2,'L',3,'L',5,'L',3),
    [sIds[0][1]]:altCmp(0,1,2,'R',5,'L',2,'L',7),
    [sIds[1][0]]:altCmp(0,1,2,'L',7,'L',5,'R',2),
    [sIds[1][1]]:altCmp(0,1,2,'R',7,'R',3,'L',5),
    [cIds[2]]:altCmp(0,1,2,'R',3,'R',5,'R',2),
  };

  S.step=1;
  render();
}
