<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHP 의사결정 분석기</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a56db;--blue-dark:#1e40af;--blue-light:#eff6ff;
  --indigo:#6366f1;--teal:#0d9488;--green:#10b981;
  --amber:#f59e0b;--red:#ef4444;--rose:#f43f5e;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
}
html,body{min-height:100vh;background:var(--gray-50);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;color:var(--gray-800);font-size:15px;line-height:1.6}

/* ── HEADER ── */
.app-header{background:linear-gradient(135deg,#1e3a5f 0%,#1a56db 100%);color:#fff;padding:1.5rem 2rem;box-shadow:0 2px 12px rgba(30,58,95,.4)}
.app-header h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:.6rem}
.app-header h1 svg{opacity:.9}
.app-header p{font-size:.85rem;opacity:.75;margin-top:.2rem}

/* ── PROGRESS ── */
.progress-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:1.5rem 2rem;background:#fff;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.step-item{display:flex;align-items:center;gap:.5rem;position:relative}
.step-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;transition:all .3s;flex-shrink:0;border:2px solid var(--gray-300);background:#fff;color:var(--gray-500);cursor:default}
.step-dot.active{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(26,86,219,.2)}
.step-dot.done{border-color:var(--green);background:var(--green);color:#fff}
.step-dot.done::after{content:'✓';font-size:1rem}
.step-dot.done span{display:none}
.step-label{font-size:.8rem;color:var(--gray-500);white-space:nowrap;font-weight:500}
.step-label.active{color:var(--blue);font-weight:700}
.step-connector{width:60px;height:2px;background:var(--gray-200);margin:0 .5rem;flex-shrink:0;transition:background .3s}
.step-connector.done{background:var(--green)}
@media(max-width:600px){.step-label{display:none}.step-connector{width:30px}}

/* ── MAIN ── */
.main{max-width:960px;margin:0 auto;padding:2rem 1.5rem}

/* ── CARD ── */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-md);padding:2rem;margin-bottom:1.5rem;border:1px solid var(--gray-200)}
.card-title{font-size:1.2rem;font-weight:700;color:var(--gray-900);margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
.card-desc{font-size:.875rem;color:var(--gray-500);margin-bottom:1.5rem}

/* ── FORM ── */
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:.875rem;font-weight:600;color:var(--gray-700);margin-bottom:.4rem}
input[type=text]{width:100%;padding:.65rem 1rem;border:1.5px solid var(--gray-300);border-radius:var(--radius-sm);font-size:.95rem;transition:border .2s,box-shadow .2s;outline:none;color:var(--gray-900)}
input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}

/* ── ITEM LIST ── */
.item-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem}
.item-row{display:flex;align-items:center;gap:.6rem;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:.6rem .8rem;transition:all .2s}
.item-row:hover{border-color:var(--gray-300);background:var(--gray-100)}
.item-num{width:24px;height:24px;border-radius:50%;background:var(--blue-light);color:var(--blue);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item-name{flex:1;font-size:.9rem;color:var(--gray-800)}
.btn-del{width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--gray-400);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.btn-del:hover{background:var(--red);color:#fff}

.add-row{display:flex;gap:.5rem;margin-top:.5rem}
.add-row input{flex:1}
.btn-add{padding:.65rem 1.2rem;background:var(--blue-light);color:var(--blue);border:1.5px solid var(--blue);border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;font-weight:600;white-space:nowrap;transition:all .2s}
.btn-add:hover{background:var(--blue);color:#fff}

/* ── BUTTONS ── */
.btn{padding:.7rem 1.6rem;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 4px rgba(26,86,219,.3)}
.btn-primary:hover{background:var(--blue-dark);transform:translateY(-1px)}
.btn-secondary{background:var(--gray-100);color:var(--gray-700);border:1.5px solid var(--gray-300)}
.btn-secondary:hover{background:var(--gray-200)}
.btn-success{background:var(--green);color:#fff;box-shadow:0 2px 4px rgba(16,185,129,.3)}
.btn-success:hover{background:#059669}
.btn-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--gray-100)}

/* ── COMPARISON ── */
.comparison-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;transition:all .2s}
.comparison-card:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.08)}
.comparison-card.inconsistent{border-color:var(--amber)}
.cmp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:1rem}
.cmp-label{font-weight:600;font-size:.9rem;color:var(--gray-700);text-align:center;flex:1;padding:.4rem .6rem;background:var(--gray-50);border-radius:6px;border:1px solid var(--gray-200)}
.cmp-vs{color:var(--gray-400);font-size:.8rem;font-weight:700;flex-shrink:0}
.cmp-scale{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:nowrap;overflow-x:auto;padding:.25rem 0}
.scale-btn{min-width:34px;height:34px;border:1.5px solid var(--gray-200);background:#fff;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--gray-500);transition:all .15s;flex-shrink:0}
.scale-btn:hover{border-color:var(--blue);color:var(--blue)}
.scale-btn.active-left{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.08)}
.scale-btn.active-right{background:var(--indigo);border-color:var(--indigo);color:#fff;transform:scale(1.08)}
.scale-btn.active-equal{background:var(--teal);border-color:var(--teal);color:#fff;transform:scale(1.08)}
.scale-sep{width:1px;height:28px;background:var(--gray-300);flex-shrink:0;margin:0 2px}
.cmp-verbal{text-align:center;font-size:.8rem;color:var(--gray-500);margin-top:.5rem;min-height:1.2em}

/* ── CR BADGE ── */
.cr-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .8rem;border-radius:999px;font-size:.78rem;font-weight:700}
.cr-ok{background:#d1fae5;color:#065f46}
.cr-warn{background:#fef3c7;color:#92400e}
.cr-bad{background:#fee2e2;color:#991b1b}

/* ── RESULTS ── */
.result-section{margin-bottom:2rem}
.result-title{font-size:1rem;font-weight:700;color:var(--gray-700);margin-bottom:1rem;display:flex;align-items:center;gap:.4rem;border-bottom:2px solid var(--gray-100);padding-bottom:.6rem}
.rank-list{display:flex;flex-direction:column;gap:.8rem}
.rank-item{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:1rem;padding:.9rem 1.2rem;background:var(--gray-50);border-radius:var(--radius-sm);border:1px solid var(--gray-200);transition:all .2s}
.rank-item:first-child{background:linear-gradient(135deg,#fef9c3,#fef3c7);border-color:#fcd34d}
.rank-item:nth-child(2){background:linear-gradient(135deg,#f0f0f0,#e5e7eb);border-color:#d1d5db}
.rank-item:nth-child(3){background:linear-gradient(135deg,#fff7ed,#fed7aa);border-color:#fdba74}
.rank-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;background:var(--blue);color:#fff}
.rank-item:first-child .rank-num{background:var(--amber);color:#fff}
.rank-item:nth-child(2) .rank-num{background:var(--gray-500)}
.rank-item:nth-child(3) .rank-num{background:#cd7c4a}
.rank-name{font-weight:600;font-size:.95rem;color:var(--gray-800)}
.rank-bar-wrap{height:8px;background:var(--gray-200);border-radius:99px;margin-top:.3rem;overflow:hidden}
.rank-bar{height:100%;background:var(--blue);border-radius:99px;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.rank-item:first-child .rank-bar{background:linear-gradient(90deg,var(--amber),#f97316)}
.rank-pct{font-size:1.1rem;font-weight:800;color:var(--blue);min-width:52px;text-align:right}
.rank-item:first-child .rank-pct{color:var(--amber)}

.weights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}
.weight-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:1rem;text-align:center}
.weight-name{font-size:.85rem;color:var(--gray-600);margin-bottom:.4rem;font-weight:600}
.weight-val{font-size:1.5rem;font-weight:800;color:var(--blue)}
.weight-pct{font-size:.8rem;color:var(--gray-500)}

.cr-table{width:100%;border-collapse:collapse;font-size:.875rem}
.cr-table th{text-align:left;padding:.6rem .8rem;background:var(--gray-100);color:var(--gray-600);font-weight:600;border-bottom:2px solid var(--gray-200)}
.cr-table td{padding:.6rem .8rem;border-bottom:1px solid var(--gray-100)}
.cr-table tr:last-child td{border:none}

/* ── TABS ── */
.tabs{display:flex;gap:.25rem;margin-bottom:1.5rem;flex-wrap:wrap}
.tab-btn{padding:.5rem 1rem;border:1.5px solid var(--gray-200);border-radius:999px;background:#fff;font-size:.83rem;font-weight:600;color:var(--gray-600);cursor:pointer;transition:all .2s}
.tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tab-btn.tab-done{border-color:var(--green);color:var(--green)}
.tab-btn.active.tab-done{background:var(--green);color:#fff}

/* ── ALERTS ── */
.alert{display:flex;align-items:flex-start;gap:.6rem;padding:.9rem 1rem;border-radius:var(--radius-sm);font-size:.875rem;margin-bottom:1rem}
.alert-info{background:var(--blue-light);border:1px solid #bfdbfe;color:#1e40af}
.alert-warn{background:#fef3c7;border:1px solid #fcd34d;color:#92400e}

/* ── INTRO ── */
.intro-hero{text-align:center;padding:3rem 1rem 2rem;background:linear-gradient(135deg,#1e3a5f 0%,#1a56db 100%);color:#fff;margin:-2rem -1.5rem 2rem;border-radius:0 0 var(--radius) var(--radius)}
.intro-hero h2{font-size:1.8rem;font-weight:800;margin-bottom:.5rem}
.intro-hero p{opacity:.8;max-width:520px;margin:0 auto;line-height:1.7}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.feature-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:1.2rem;text-align:center}
.feature-icon{font-size:1.8rem;margin-bottom:.5rem}
.feature-title{font-weight:700;font-size:.9rem;color:var(--gray-800);margin-bottom:.25rem}
.feature-desc{font-size:.8rem;color:var(--gray-500);line-height:1.5}

/* ── GOAL BADGE ── */
.goal-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--blue-light);border:1px solid #bfdbfe;color:var(--blue-dark);border-radius:999px;padding:.35rem 1rem;font-size:.85rem;font-weight:600;margin-bottom:1.5rem}

/* ── ANIM ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeInUp .35s ease both}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:8px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}

/* ── LEGEND ── */
.scale-legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--gray-500);margin-top:.75rem;padding:.5rem;background:var(--gray-50);border-radius:var(--radius-sm)}
.legend-item{display:flex;align-items:center;gap:.3rem}
.legend-dot{width:10px;height:10px;border-radius:50%}

/* ── MATRIX TABLE ── */
.matrix-wrap{overflow-x:auto;margin-top:.75rem}
.matrix-table{border-collapse:collapse;font-size:.78rem;white-space:nowrap}
.matrix-table th,.matrix-table td{padding:.4rem .6rem;border:1px solid var(--gray-200);text-align:center}
.matrix-table th{background:var(--gray-100);font-weight:700;color:var(--gray-700)}
.matrix-table .diag{background:var(--gray-50);color:var(--gray-400)}
.matrix-table .above{color:var(--blue)}
.matrix-table .below{color:var(--indigo)}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
const S = {
  step: 0, // 0=intro, 1=setup, 2=criteria-cmp, 3=alt-cmp, 4=results
  goal: '',
  criteria: [],   // [{id, name}]
  alts: [],       // [{id, name}]
  // Pairwise comparisons: key = "i,j" (i<j), value = {p:'L'|'R'|'E', v:1-9}
  criCmp: {},
  altCmps: {},    // {criterionId: {"i,j": {p,v}}}
  activeTab: 0,   // for step 3 tab
};

let idSeq = 0;
const uid = () => ++idSeq;

// ─────────────────────────────────────────────────────────────────
// AHP CORE
// ─────────────────────────────────────────────────────────────────
const RI = [0,0,0,.58,.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.54];

function buildMatrix(n, cmps, ids) {
  const M = Array.from({length:n}, () => new Array(n).fill(1));
  for (let i = 0; i < n; i++) {
    for (let j = i+1; j < n; j++) {
      const key = `${ids[i]},${ids[j]}`;
      const c = cmps[key] || {p:'E',v:1};
      let val;
      if (c.p === 'E') val = 1;
      else if (c.p === 'L') val = c.v;
      else val = 1/c.v;
      M[i][j] = val;
      M[j][i] = 1/val;
    }
  }
  return M;
}

function calcAHP(M) {
  const n = M.length;
  const colSums = new Array(n).fill(0);
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) colSums[j]+=M[i][j];
  const norm = M.map((row,i)=>row.map((v,j)=>v/colSums[j]));
  const w = norm.map(row=>row.reduce((s,v)=>s+v,0)/n);
  const Aw = M.map((row,i)=>row.reduce((s,v,j)=>s+v*w[j],0));
  const lmax = Aw.reduce((s,v,i)=>s+v/w[i],0)/n;
  const CI = n<=1 ? 0 : (lmax-n)/(n-1);
  const ri = RI[Math.min(n,12)]||1.54;
  const CR = n<=2 ? 0 : CI/ri;
  return {w, lmax, CI, CR};
}

function finalScores() {
  const cn = S.criteria.length, an = S.alts.length;
  const cIds = S.criteria.map(c=>c.id);
  const aIds = S.alts.map(a=>a.id);

  const criM = buildMatrix(cn, S.criCmp, cIds);
  const {w:criW, CR:criCR} = calcAHP(criM);

  const altWs = [], crCRs = [];
  for (let ci=0;ci<cn;ci++) {
    const cid = cIds[ci];
    const cmpMap = S.altCmps[cid]||{};
    const M = buildMatrix(an, cmpMap, aIds);
    const {w, CR} = calcAHP(M);
    altWs.push(w);
    crCRs.push(CR);
  }

  const scores = aIds.map((_,ai)=>
    criW.reduce((s,cw,ci)=>s+cw*altWs[ci][ai], 0)
  );

  return {criW, altWs, scores, criCR, crCRs};
}

// ─────────────────────────────────────────────────────────────────
// VERBAL SCALE
// ─────────────────────────────────────────────────────────────────
const VERBAL = {
  1:'동등 (Equal)',2:'약간 (Weak)',3:'보통 중요 (Moderate)',
  4:'보통+ (Mod. Strong)',5:'강한 중요 (Strong)',6:'강한+ (Strong+)',
  7:'매우 강한 (Very Strong)',8:'매우강한+ (V.Strong+)',9:'극히 중요 (Extreme)'
};

// ─────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const app = document.getElementById('app');

function render() {
  const steps = ['도입','설정','기준 비교','대안 비교','결과'];
  const progressHTML = steps.slice(1).map((label,i)=>{
    const n = i+1;
    const isActive = S.step === n;
    const isDone = S.step > n;
    return `
      ${i>0?`<div class="step-connector ${S.step>i?'done':''}"></div>`:''}
      <div class="step-item">
        <div class="step-dot ${isActive?'active':''} ${isDone?'done':''}">
          <span>${n}</span>
        </div>
        <span class="step-label ${isActive?'active':''}">${label}</span>
      </div>`;
  }).join('');

  let body = '';
  if (S.step===0) body = renderIntro();
  else if (S.step===1) body = renderSetup();
  else if (S.step===2) body = renderCriCmp();
  else if (S.step===3) body = renderAltCmp();
  else if (S.step===4) body = renderResults();

  app.innerHTML = `
    <header class="app-header">
      <h1>
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        AHP 의사결정 분석기
      </h1>
      <p>계층적 분석 프로세스 (Analytic Hierarchy Process)</p>
    </header>
    ${S.step>0?`<div class="progress-bar">${progressHTML}</div>`:''}
    <div class="main animate-in">${body}</div>
  `;
  attachEvents();
  // animate bars after render
  if (S.step===4) setTimeout(animateBars, 100);
}

// ─── INTRO ───────────────────────────────────────────────────────
function renderIntro() {
  return `
    <div class="intro-hero">
      <h2>체계적 의사결정을 위한 AHP 분석</h2>
      <p>복잡한 의사결정 문제를 계층 구조로 분해하고,<br>쌍 비교를 통해 최적의 대안을 도출합니다.</p>
    </div>
    <div class="feature-grid">
      <div class="feature-card">
        <div class="feature-icon">🎯</div>
        <div class="feature-title">명확한 목표 설정</div>
        <div class="feature-desc">의사결정 목표와 평가 기준, 대안을 체계적으로 구성</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">⚖️</div>
        <div class="feature-title">쌍 비교 (Pairwise)</div>
        <div class="feature-desc">Saaty 1-9 척도로 기준 및 대안의 상대적 중요도 비교</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">📊</div>
        <div class="feature-title">일관성 검증</div>
        <div class="feature-desc">일관성 비율(CR &lt; 0.10) 자동 계산으로 판단 신뢰도 확인</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🏆</div>
        <div class="feature-title">최적 대안 도출</div>
        <div class="feature-desc">가중치 합산을 통한 최종 순위 및 시각적 결과 제공</div>
      </div>
    </div>
    <div style="text-align:center;margin-top:1rem">
      <button class="btn btn-primary" style="font-size:1rem;padding:.9rem 2.5rem" onclick="goStep(1)">
        분석 시작하기 →
      </button>
    </div>
  `;
}

// ─── STEP 1: SETUP ───────────────────────────────────────────────
function renderSetup() {
  const criItems = S.criteria.map((c,i)=>`
    <div class="item-row">
      <div class="item-num">${i+1}</div>
      <div class="item-name">${escHtml(c.name)}</div>
      <button class="btn-del" onclick="delItem('criteria','${c.id}')" title="삭제">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`).join('');

  const altItems = S.alts.map((a,i)=>`
    <div class="item-row">
      <div class="item-num">${i+1}</div>
      <div class="item-name">${escHtml(a.name)}</div>
      <button class="btn-del" onclick="delItem('alts','${a.id}')" title="삭제">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`).join('');

  const canNext = S.goal.trim() && S.criteria.length>=2 && S.alts.length>=2;

  return `
    <div class="card">
      <div class="card-title">🎯 의사결정 목표</div>
      <div class="card-desc">해결하고자 하는 문제 또는 선택 목표를 입력하세요.</div>
      <div class="form-group">
        <input type="text" id="goalInput" value="${escHtml(S.goal)}" placeholder="예: 취업할 회사 선택, 구매할 노트북 결정…" maxlength="80">
      </div>
    </div>

    <div class="card">
      <div class="card-title">📋 평가 기준 <span style="font-size:.8rem;color:var(--gray-500);font-weight:400">(최소 2개, 최대 10개)</span></div>
      <div class="card-desc">대안들을 평가할 기준을 입력하세요.</div>
      <div class="item-list" id="criList">${criItems||'<div style="color:var(--gray-400);font-size:.85rem;padding:.5rem">기준을 추가하세요</div>'}</div>
      <div class="add-row">
        <input type="text" id="criInput" placeholder="기준 입력 (Enter)" maxlength="40">
        <button class="btn-add" onclick="addItem('criteria')">+ 추가</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🔄 비교 대안 <span style="font-size:.8rem;color:var(--gray-500);font-weight:400">(최소 2개, 최대 10개)</span></div>
      <div class="card-desc">선택하거나 비교할 대안(옵션)을 입력하세요.</div>
      <div class="item-list" id="altList">${altItems||'<div style="color:var(--gray-400);font-size:.85rem;padding:.5rem">대안을 추가하세요</div>'}</div>
      <div class="add-row">
        <input type="text" id="altInput" placeholder="대안 입력 (Enter)" maxlength="40">
        <button class="btn-add" onclick="addItem('alts')">+ 추가</button>
      </div>
    </div>

    <div class="btn-nav">
      <button class="btn btn-secondary" onclick="goStep(0)">← 처음으로</button>
      <button class="btn btn-primary" onclick="goStep(2)" ${canNext?'':'disabled style="opacity:.4;cursor:not-allowed"'}>
        다음: 기준 비교 →
      </button>
    </div>
  `;
}

// ─── STEP 2: CRITERIA COMPARISON ─────────────────────────────────
function renderCriCmp() {
  const n = S.criteria.length;
  const pairs = [];
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++) pairs.push([i,j]);

  const {CR} = calcAHP(buildMatrix(n, S.criCmp, S.criteria.map(c=>c.id)));
  const crBadge = crBadgeHTML(CR, n);

  const pairsHTML = pairs.map(([i,j])=>renderCmpRow(
    S.criteria[i], S.criteria[j],
    S.criCmp, 'cri'
  )).join('');

  return `
    <div class="goal-badge">🎯 목표: ${escHtml(S.goal)}</div>
    <div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem">
        <div>
          <div class="card-title">⚖️ 기준 간 중요도 비교</div>
          <div class="card-desc" style="margin:0">두 기준 중 어느 것이 더 중요한지, 얼마나 더 중요한지 선택하세요.</div>
        </div>
        ${crBadge}
      </div>
      <div class="alert alert-info">
        <span>ℹ️</span>
        <span>왼쪽/오른쪽 버튼으로 더 중요한 기준을 선택하고, 숫자로 강도를 지정하세요. <b>1 = 동등, 9 = 극히 중요</b></span>
      </div>
      ${pairsHTML}
      <div class="scale-legend">
        <span style="font-weight:600;color:var(--gray-600)">척도:</span>
        ${[1,3,5,7,9].map(v=>`<span class="legend-item"><span class="legend-dot" style="background:${v===1?'var(--teal)':'var(--blue)'}"></span>${v}: ${VERBAL[v]}</span>`).join('')}
      </div>
    </div>

    <div class="btn-nav">
      <button class="btn btn-secondary" onclick="goStep(1)">← 설정으로</button>
      <button class="btn btn-primary" onclick="goStep(3)">다음: 대안 비교 →</button>
    </div>
  `;
}

// ─── STEP 3: ALT COMPARISON ──────────────────────────────────────
function renderAltCmp() {
  const ci = S.activeTab;
  const crit = S.criteria[ci];
  const n = S.alts.length;
  const aIds = S.alts.map(a=>a.id);
  const cmpMap = S.altCmps[crit.id]||{};
  const {CR} = calcAHP(buildMatrix(n, cmpMap, aIds));
  const crBadge = crBadgeHTML(CR, n);

  const tabs = S.criteria.map((c,i)=>{
    const cm = S.altCmps[c.id]||{};
    const filled = Object.keys(cm).length;
    const total = n*(n-1)/2;
    const done = filled>0 && Object.values(cm).every(x=>x.p!==undefined);
    return `<button class="tab-btn ${i===ci?'active':''} ${done?'tab-done':''}" onclick="setTab(${i})">${escHtml(c.name)}</button>`;
  }).join('');

  const pairsHTML = renderAltPairs(ci);

  const allDone = S.criteria.every((c,ci2)=>{
    const cm = S.altCmps[c.id]||{};
    const total = n*(n-1)/2;
    return Object.keys(cm).length >= total;
  });

  return `
    <div class="goal-badge">🎯 목표: ${escHtml(S.goal)}</div>
    <div class="card">
      <div class="card-title">🔄 대안 간 비교 (기준별)</div>
      <div class="card-desc">각 기준에 대해 대안들을 쌍 비교하세요. 탭으로 기준을 전환합니다.</div>
      <div class="tabs">${tabs}</div>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem">
        <div style="font-weight:700;color:var(--blue)">기준: ${escHtml(crit.name)}</div>
        ${crBadge}
      </div>
      ${pairsHTML}
    </div>

    <div class="btn-nav">
      <button class="btn btn-secondary" onclick="goStep(2)">← 기준 비교</button>
      <button class="btn btn-success" onclick="goStep(4)">📊 결과 보기 →</button>
    </div>
  `;
}

function renderAltPairs(ci) {
  const crit = S.criteria[ci];
  const n = S.alts.length;
  const cmpMap = S.altCmps[crit.id]||{};
  const pairs = [];
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++) pairs.push([i,j]);
  return pairs.map(([i,j])=>renderCmpRow(
    S.alts[i], S.alts[j],
    cmpMap, `alt_${crit.id}`
  )).join('');
}

// ─── COMPARISON ROW ───────────────────────────────────────────────
function renderCmpRow(itemA, itemB, cmpMap, prefix) {
  const key = `${itemA.id},${itemB.id}`;
  const cmp = cmpMap[key]||{p:'E',v:1};

  const scaleValues = [9,8,7,6,5,4,3,2];
  const leftBtns = scaleValues.map(v=>{
    const active = cmp.p==='L' && cmp.v===v ? 'active-left' : '';
    return `<button class="scale-btn ${active}" data-key="${key}" data-p="L" data-v="${v}" data-prefix="${prefix}">${v}</button>`;
  }).join('');

  const eqActive = cmp.p==='E' ? 'active-equal' : '';
  const centerBtn = `<button class="scale-btn ${eqActive}" data-key="${key}" data-p="E" data-v="1" data-prefix="${prefix}" style="font-weight:800">1</button>`;

  const rightBtns = [2,3,4,5,6,7,8,9].map(v=>{
    const active = cmp.p==='R' && cmp.v===v ? 'active-right' : '';
    return `<button class="scale-btn ${active}" data-key="${key}" data-p="R" data-v="${v}" data-prefix="${prefix}">${v}</button>`;
  }).join('');

  let verbal = '';
  if (cmp.p==='E') verbal = `⚖️ 두 항목이 <b>동등</b>하게 중요합니다`;
  else {
    const who = cmp.p==='L' ? `<b style="color:var(--blue)">${escHtml(itemA.name)}</b>` : `<b style="color:var(--indigo)">${escHtml(itemB.name)}</b>`;
    verbal = `${who}이(가) <b>${VERBAL[cmp.v]||cmp.v}배</b> 더 중요합니다`;
  }

  const matVal = cmp.p==='E'?1:cmp.p==='L'?cmp.v:1/cmp.v;
  const matStr = matVal>=1 ? matVal.toFixed(matVal===Math.round(matVal)?0:3) : `1/${Math.round(1/matVal)}`;

  return `
    <div class="comparison-card">
      <div class="cmp-header">
        <div class="cmp-label" style="color:var(--blue-dark);border-color:var(--blue);background:var(--blue-light)">${escHtml(itemA.name)}</div>
        <div class="cmp-vs">VS</div>
        <div class="cmp-label" style="color:var(--indigo);border-color:var(--indigo);background:#eef2ff">${escHtml(itemB.name)}</div>
      </div>
      <div class="cmp-scale">
        <span style="font-size:.7rem;color:var(--blue);font-weight:700;margin-right:2px">←</span>
        ${leftBtns}
        <div class="scale-sep"></div>
        ${centerBtn}
        <div class="scale-sep"></div>
        ${rightBtns}
        <span style="font-size:.7rem;color:var(--indigo);font-weight:700;margin-left:2px">→</span>
      </div>
      <div class="cmp-verbal">
        ${verbal}
        <span style="color:var(--gray-400);font-size:.75rem;margin-left:.5rem">[행렬값: ${matStr}]</span>
      </div>
    </div>
  `;
}

// ─── CR BADGE ─────────────────────────────────────────────────────
function crBadgeHTML(CR, n) {
  if (n<=2) return `<span class="cr-badge cr-ok">일관성 검증 불필요 (n≤2)</span>`;
  const pct = (CR*100).toFixed(1);
  if (CR<0.10) return `<span class="cr-badge cr-ok">✓ CR = ${pct}% (일관성 양호)</span>`;
  if (CR<0.20) return `<span class="cr-badge cr-warn">⚠ CR = ${pct}% (재검토 권장)</span>`;
  return `<span class="cr-badge cr-bad">✗ CR = ${pct}% (불일관 — 재비교 필요)</span>`;
}

// ─── STEP 4: RESULTS ─────────────────────────────────────────────
function renderResults() {
  const {criW, altWs, scores, criCR, crCRs} = finalScores();
  const n = S.alts.length;

  const ranked = S.alts.map((a,i)=>({...a, score:scores[i]}))
    .sort((a,b)=>b.score-a.score);
  const maxScore = ranked[0].score;

  const rankHTML = ranked.map((a,rank)=>`
    <div class="rank-item" style="animation:fadeInUp .4s ${rank*.08}s both">
      <div class="rank-num">${rank+1}</div>
      <div>
        <div class="rank-name">${escHtml(a.name)}</div>
        <div class="rank-bar-wrap">
          <div class="rank-bar" data-pct="${(a.score/maxScore*100).toFixed(1)}" style="width:0%"></div>
        </div>
      </div>
      <div class="rank-pct">${(a.score*100).toFixed(1)}%</div>
    </div>`).join('');

  const weightsHTML = S.criteria.map((c,i)=>`
    <div class="weight-card">
      <div class="weight-name">${escHtml(c.name)}</div>
      <div class="weight-val">${(criW[i]*100).toFixed(1)}<span style="font-size:.9rem">%</span></div>
      <div class="weight-pct">가중치 ${criW[i].toFixed(4)}</div>
    </div>`).join('');

  const crTableRows = S.criteria.map((c,i)=>{
    const cr = crCRs[i];
    const badge = crBadgeHTML(cr, n);
    return `<tr><td>${escHtml(c.name)}</td><td>${badge}</td><td>${(cr*100).toFixed(1)}%</td></tr>`;
  }).join('');

  // Breakdown table
  const breakdownHeader = S.criteria.map(c=>`<th>${escHtml(c.name)}<br><small style="font-weight:400;color:var(--gray-500)">${(criW[S.criteria.indexOf(c)]*100).toFixed(0)}%</small></th>`).join('');
  const breakdownRows = ranked.map(a=>{
    const origIdx = S.alts.findIndex(x=>x.id===a.id);
    const cells = S.criteria.map((_,ci)=>`<td>${(altWs[ci][origIdx]*100).toFixed(1)}%</td>`).join('');
    return `<tr><td style="font-weight:600">${escHtml(a.name)}</td>${cells}<td style="font-weight:700;color:var(--blue)">${(a.score*100).toFixed(1)}%</td></tr>`;
  }).join('');

  return `
    <div class="goal-badge">🎯 목표: ${escHtml(S.goal)}</div>

    <div class="card">
      <div class="result-title">🏆 최종 순위</div>
      <div class="rank-list">${rankHTML}</div>
    </div>

    <div class="card">
      <div class="result-title">📐 기준별 가중치</div>
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem">
        ${crBadgeHTML(criCR, S.criteria.length)}
      </div>
      <div class="weights-grid">${weightsHTML}</div>
    </div>

    <div class="card">
      <div class="result-title">📊 상세 점수 분해</div>
      <div class="matrix-wrap">
        <table class="matrix-table" style="width:100%">
          <thead><tr><th>대안</th>${breakdownHeader}<th>종합</th></tr></thead>
          <tbody>${breakdownRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="result-title">✅ 일관성 검증 결과</div>
      <table class="cr-table">
        <thead><tr><th>기준</th><th>판정</th><th>CR 값</th></tr></thead>
        <tbody>
          <tr><td>기준 간 비교</td><td>${crBadgeHTML(criCR,S.criteria.length)}</td><td>${(criCR*100).toFixed(1)}%</td></tr>
          ${crTableRows}
        </tbody>
      </table>
      <div style="margin-top:.75rem;font-size:.8rem;color:var(--gray-500)">
        * CR &lt; 10%: 일관성 양호 / CR 10-20%: 재검토 권장 / CR &gt; 20%: 비교 재수행 필요
      </div>
    </div>

    <div class="btn-nav">
      <button class="btn btn-secondary" onclick="goStep(3)">← 대안 비교</button>
      <div style="display:flex;gap:.75rem">
        <button class="btn btn-secondary" onclick="window.print()">🖨️ 인쇄</button>
        <button class="btn btn-primary" onclick="resetAll()">새 분석 시작</button>
      </div>
    </div>
  `;
}

function animateBars() {
  document.querySelectorAll('.rank-bar[data-pct]').forEach(el=>{
    el.style.width = el.dataset.pct + '%';
  });
}

// ─────────────────────────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────────────────────────
function attachEvents() {
  // goal input
  const gi = $('goalInput');
  if (gi) gi.addEventListener('input', e=>{ S.goal=e.target.value; });

  // enter to add items
  const ci2 = $('criInput');
  if (ci2) ci2.addEventListener('keydown',e=>{ if(e.key==='Enter') addItem('criteria'); });
  const ai2 = $('altInput');
  if (ai2) ai2.addEventListener('keydown',e=>{ if(e.key==='Enter') addItem('alts'); });

  // scale buttons
  document.querySelectorAll('.scale-btn[data-key]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const {key, p, v, prefix} = btn.dataset;
      const val = {p, v:parseInt(v)};
      if (prefix==='cri') {
        S.criCmp[key] = val;
      } else {
        const cid = prefix.replace('alt_','');
        if (!S.altCmps[cid]) S.altCmps[cid]={};
        S.altCmps[cid][key] = val;
      }
      render();
    });
  });
}

// ─────────────────────────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────────────────────────
function goStep(n) {
  if (n===1 && $('goalInput')) S.goal = $('goalInput').value.trim();
  S.step = n;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function setTab(i) { S.activeTab=i; render(); }

function addItem(type) {
  const inp = $(type==='criteria'?'criInput':'altInput');
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) return;
  const limit = type==='criteria'?10:10;
  if (S[type].length>=limit) return;
  // duplicate check
  if (S[type].some(x=>x.name.toLowerCase()===name.toLowerCase())) {
    inp.style.borderColor='var(--red)';
    setTimeout(()=>inp.style.borderColor='',1500);
    return;
  }
  S.goal = $('goalInput')?.value.trim() || S.goal;
  S[type].push({id:uid(), name});
  inp.value='';
  render();
  // re-focus
  setTimeout(()=>{
    const el = $(type==='criteria'?'criInput':'altInput');
    if(el) el.focus();
  },50);
}

function delItem(type, id) {
  S.goal = $('goalInput')?.value.trim() || S.goal;
  S[type] = S[type].filter(x=>x.id!=id);
  // clean up comparisons referencing this id
  if (type==='criteria') {
    const newCmp = {};
    Object.entries(S.criCmp).forEach(([k,v])=>{
      if(!k.includes(','+id) && !k.startsWith(id+',')) newCmp[k]=v;
    });
    S.criCmp = newCmp;
    delete S.altCmps[id];
  }
  render();
}

function resetAll() {
  S.step=0; S.goal=''; S.criteria=[]; S.alts=[];
  S.criCmp={}; S.altCmps={}; S.activeTab=0;
  render();
}

// ─────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────────────────────────
// DEMO DATA (for quick testing)
// ─────────────────────────────────────────────────────────────────
function loadDemo() {
  S.goal = '최적 취업 회사 선택';
  S.criteria = [
    {id:uid(),name:'연봉/복지'},
    {id:uid(),name:'성장 가능성'},
    {id:uid(),name:'워라밸'},
    {id:uid(),name:'기업 안정성'},
  ];
  S.alts = [
    {id:uid(),name:'대기업 A'},
    {id:uid(),name:'스타트업 B'},
    {id:uid(),name:'중견기업 C'},
  ];
  // preset some comparisons
  const [c1,c2,c3,c4] = S.criteria.map(c=>c.id);
  S.criCmp = {
    [`${c1},${c2}`]:{p:'L',v:3},
    [`${c1},${c3}`]:{p:'L',v:5},
    [`${c1},${c4}`]:{p:'L',v:2},
    [`${c2},${c3}`]:{p:'L',v:3},
    [`${c2},${c4}`]:{p:'E',v:1},
    [`${c3},${c4}`]:{p:'R',v:2},
  };
  const [a1,a2,a3] = S.alts.map(a=>a.id);
  [c1,c2,c3,c4].forEach((cid,ci)=>{
    S.altCmps[cid]={};
    const demos = [
      {[`${a1},${a2}`]:{p:'L',v:5},[`${a1},${a3}`]:{p:'L',v:3},[`${a2},${a3}`]:{p:'R',v:2}},
      {[`${a1},${a2}`]:{p:'R',v:7},[`${a1},${a3}`]:{p:'R',v:3},[`${a2},${a3}`]:{p:'L',v:5}},
      {[`${a1},${a2}`]:{p:'R',v:5},[`${a1},${a3}`]:{p:'E',v:1},[`${a2},${a3}`]:{p:'L',v:5}},
      {[`${a1},${a2}`]:{p:'L',v:7},[`${a1},${a3}`]:{p:'L',v:5},[`${a2},${a3}`]:{p:'R',v:2}},
    ];
    S.altCmps[cid] = demos[ci];
  });
  S.step=1;
  render();
}

// expose globals
window.goStep = goStep;
window.setTab = setTab;
window.addItem = addItem;
window.delItem = delItem;
window.resetAll = resetAll;
window.loadDemo = loadDemo;

// ─────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────
render();
</script>
